<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/three-kit.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0c0f; }
      #ground { position: absolute; inset: 0; background: #0a0c0f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="burnline" data-composition-id="burnline" data-composition-src="compositions/burnline.html"
        data-start="2.8" data-duration="2.05" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="flow" data-composition-id="flow" data-composition-src="compositions/flow.html"
        data-start="4.55" data-duration="2.167" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="wisp" data-composition-id="wisp" data-composition-src="compositions/wisp.html"
        data-start="6.417" data-duration="2.166" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:4"></div>
      <div id="ghost" data-composition-id="ghost" data-composition-src="compositions/ghost.html"
        data-start="8.283" data-duration="2.634" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="parts" data-composition-id="parts" data-composition-src="compositions/parts.html"
        data-start="10.617" data-duration="3.133" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:6"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="13.45" data-duration="1.55" data-track-index="7" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:7"></div>
      <div id="leak" data-composition-id="leak" data-composition-src="compositions/leak.html"
        data-start="2.5" data-duration="0.7" data-track-index="20" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:50"></div>
    </div>
    <script>
      var tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 15);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
