<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; overflow: hidden; background: transparent; }
    #parts-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }

    
    #parts-bg { position: absolute; inset: 0; background: #0a0c0f; overflow: hidden; }
    #parts-grid { position: absolute; inset: 0; opacity: 0.35;
      background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 30%, transparent 75%); }
    .parts-glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(80px); }
    #parts-glow-a { left: -260px; top: 240px; background: #7fd6ff; opacity: 0.22; }
    #parts-glow-b { left: 460px; top: 980px; background: #7fd6ff; opacity: 0.12; }
    #parts-shadows { position: absolute; inset: 0; }
    .parts-sh { position: absolute; width: 190px; height: 34px; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 70%); }
    #parts-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    
    #parts-copy { position: absolute; left: 80px; right: 140px; top: 270px; }
    #parts-title { font: 600 128px/1.02 "Geist", sans-serif; letter-spacing: -0.035em; color: #f4f6f8; margin: 0;
      text-shadow: 0 4px 30px rgba(0,0,0,0.45); }
    .parts-w { display: inline-block; transform-origin: 50% 70%; }
    #parts-cap { position: absolute; left: 80px; right: 140px; top: 1196px; margin: 0;
      font: 500 44px/1.24 "Geist", sans-serif; letter-spacing: -0.01em; color: #f4f6f8;
      text-shadow: 0 2px 14px rgba(0,0,0,0.7), 0 0 2px rgba(0,0,0,0.6); text-wrap: balance; }
  </style>
  <div id="root" data-composition-id="parts" data-width="1080" data-height="1920">
    <div id="parts-cam">
      <div id="parts-bg">
        <div id="parts-grid"></div>
        <div id="parts-glow-a" class="parts-glow"></div>
        <div id="parts-glow-b" class="parts-glow"></div>
      </div>
      <div id="parts-shadows"><div class="parts-sh" style="left:125px;top:722px"></div><div class="parts-sh" style="left:425px;top:722px"></div><div class="parts-sh" style="left:725px;top:722px"></div><div class="parts-sh" style="left:125px;top:888px"></div><div class="parts-sh" style="left:425px;top:888px"></div><div class="parts-sh" style="left:725px;top:888px"></div><div class="parts-sh" style="left:125px;top:1054px"></div><div class="parts-sh" style="left:425px;top:1054px"></div><div class="parts-sh" style="left:725px;top:1054px"></div><div class="parts-sh" style="left:125px;top:1220px"></div><div class="parts-sh" style="left:425px;top:1220px"></div><div class="parts-sh" style="left:725px;top:1220px"></div></div>
      <canvas id="parts-canvas" width="1080" height="1920"></canvas>
      <div id="parts-copy"><h1 id="parts-title"><span class="parts-w" style="color:#7fd6ff">12</span> <span class="parts-w">printable</span> <span class="parts-w">parts</span></h1></div>
      <p id="parts-cap" style="top:1262px">every one generated by code</p>
    </div>
  </div>
  <script>
    (function () {
    var tl = gsap.timeline({ paused: true });
    
    tl.fromTo("#parts-glow-a", { x: 0, y: 0 }, { x: 140, y: -90, duration: 3.133, ease: "sine.inOut" }, 0);
    tl.fromTo("#parts-glow-b", { x: 0, y: 0 }, { x: -120, y: 70, duration: 3.133, ease: "sine.inOut" }, 0);
    tl.fromTo(".parts-w", { opacity: 0, scale: 1.35, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out", stagger: 0.167 }, 0.45);
    tl.fromTo("#parts-cap", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.55);
    tl.fromTo(".parts-sh", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.05 }, 0.2);
    // The 3D: twelve real STL files on turntables, drawn from the scene clock.
    var clock = { t: 0 };
    var stage = null;
    tl.to(clock, { t: 3.133, duration: 3.133, ease: "none", onUpdate: function () { if (stage) stage.draw(clock.t); } }, 0);
    var NAMES = ["fin","core-front","core-back","eye-bezel","spider-ring","spool","slider-pin","servo-mount","arm","head-mount","base","base-lid"];
    var CELLS = [[220,660],[520,660],[820,660],[220,826],[520,826],[820,826],[220,992],[520,992],[820,992],[220,1158],[520,1158],[820,1158]];
    function build() {
      var T = window.THREE;
      var canvas = document.getElementById("parts-canvas");
      var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      renderer.outputColorSpace = T.SRGBColorSpace;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      var scene = new T.Scene();
      var pm = new T.PMREMGenerator(renderer);
      scene.environment = pm.fromScene(new window.RoomEnvironment(), 0.04).texture;
      var cam = new T.OrthographicCamera(0, 1080, 0, -1920, -2000, 2000);
      var key = new T.DirectionalLight(0xffffff, 1.6); key.position.set(-400, 600, 900); scene.add(key);
      var rim = new T.DirectionalLight(new T.Color("#7fd6ff"), 2.2); rim.position.set(600, 200, -700); scene.add(rim);
      var mat = new T.MeshStandardMaterial({ color: 0xd3d8e0, metalness: 0.15, roughness: 0.42, transparent: true });
      var loader = new window.STLLoader();
      var items = [];
      return Promise.all(NAMES.map(function (n, i) {
        return loader.loadAsync("assets/stl/" + n + ".stl").then(function (g) {
          g.computeVertexNormals();
          g.rotateX(-Math.PI / 2);
          g.computeBoundingBox();
          var c = new T.Vector3(); g.boundingBox.getCenter(c); g.translate(-c.x, -c.y, -c.z);
          g.computeBoundingSphere();
          var m = new T.Mesh(g, mat.clone());
          var pivot = new T.Group(); pivot.add(m);
          var base = 100 / g.boundingSphere.radius;
          pivot.userData = { base: base, x: CELLS[i][0], y: CELLS[i][1], i: i };
          scene.add(pivot); items.push(pivot);
        });
      })).then(function () {
        stage = {
          draw: function (t) {
            for (var k = 0; k < items.length; k++) {
              var p = items[k], u = p.userData;
              var a = Math.min(1, Math.max(0, (t - 0.18 - u.i * 0.045) / 0.4));
              var e = 1 - Math.pow(1 - a, 4);
              var s = u.base * (1.25 - 0.25 * e);
              p.scale.set(s, s, s);
              p.position.set(u.x, -u.y - (1 - e) * 26, 0);
              p.rotation.set(0.42, -0.6 + t * 0.9 + u.i * 0.5, 0);
              p.children[0].material.opacity = e;
            }
            renderer.render(scene, cam);
          },
        };
        stage.draw(clock.t);
      });
    }
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["parts-stl"] = build();
    window.addEventListener("hf-seek", function () { if (stage) stage.draw(clock.t); });
    tl.fromTo("#parts-cam", { clipPath: "circle(0% at 424px 828px)" }, { clipPath: "circle(130% at 424px 828px)", duration: 0.42, ease: "power3.inOut" }, 0);
    tl.to("#parts-cam", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 2.833);
    // Keep the timeline exactly as long as the scene's slot.
    tl.set({}, {}, 3.133);
    window.__timelines = window.__timelines || {};
    window.__timelines["parts"] = tl;
    })();
  </script>
</template>
